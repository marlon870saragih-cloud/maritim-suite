# Pasang: /etc/systemd/system/pg-backup.service.d/10-lapor-status.conf
#
# Menambah pelaporan hasil backup TANPA menyunting /usr/local/sbin/pg-backup.sh
# maupun pg-backup.service. OnSuccess=/OnFailure= bersifat daftar — aditif
# terhadap nilai yang mungkin sudah ada di unit aslinya.
#
# Butuh systemd >= 249 (OnSuccess=). Cek dulu: systemctl --version
# Mencabut: hapus berkas ini, lalu systemctl daemon-reload.

[Unit]
OnSuccess=pg-backup-report@ok.service
OnFailure=pg-backup-report@gagal.service
